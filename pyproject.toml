[project]
name = "gameoflife"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.4",
    "omegaconf>=2.4.0",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]

ignore = [
    "UP035",
    "UP006",
    "W505"
]

[tool.ruff.lint.isort]
no-sections = false
lines-between-types = 0
